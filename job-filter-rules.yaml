version: "4.0"
profile_source: user-profile.md

target:
  locations:
    required_any:
      - "[目标城市]"
      - 明确远程
    travel:
      allowed_if_explicit_and_reasonable: true
      require_user_confirmation_if_unclear: true
  salary_k:
    resume_expectation:
      min: null
      max: null
    candidate_gate:
      minimum_source: user-profile.md
      compare: listed_lower_bound_gte_resume_min
      below_minimum_action: reject
      unknown_or_negotiable_action: manual_review
      range_rule: compare_the_listed_lower_bound_not_the_upper_bound
    unknown_salary_action: manual_review

role_priority:
  primary:
    []
  secondary:
    []

evidence_keywords:
  strong:
    []
  bounded:
    cloud:
      keywords: []
      claim_limit: 只陈述本地私有档案明确记录的事实，不补充项目、认证、规模或客户
    ai:
      keywords: []
      claim_limit: 只陈述本地私有档案明确记录的事实，不将目标或兴趣写成既有经验

hard_exclusions:
  role_or_industry:
    []
  employment:
    []
  companies:
    []
  uncertain_affiliate_action: manual_review

hard_requirement_gaps:
  action: reject_or_manual_review
  examples:
    - 用户未具备的强制证书
    - 未经证据支持的规模化平台经验
    - 未经证据支持的算法或研发经历
    - 需要特定行业深度经验但简历无证据

scoring:
  weights:
    evidence_skill_match: 40
    experience_fit: 20
    location_and_work_mode: 15
    salary_fit: 10
    employer_quality: 10
    recruiter_activity: 5
  cap: 100
  decisions:
    priority: 85
    eligible: 70
    manual_review: 55
    reject_below: 55
  hard_exclusion_overrides_score: true

deduplication:
  keys:
    - company
    - position
    - recruiter
    - job_url
  memory_file: memory/applied-history.json
  duplicate_action: skip
